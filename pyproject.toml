[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loomground-escalation"
description = "How much autonomy do these factors leave? Autonomy as the lowest ceiling several factors impose, never a weighted sum. Monotone, attributable, fail-closed. The ladder is the caller's."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSES/Apache-2.0.txt", "LICENSES/CC-BY-4.0.txt"]
authors = [{ name = "Loomground Contributors" }]
# One narrow problem, one dependency. This package sits *above* the reasoning
# kernel: it uses the shared verdict, the OPEN-dominant fold and the injected
# ports, and reaches into no solver internals. It is imported by hosts, never by
# solver, versum or governance.
dependencies = ["loomground-solver>=0.4,<0.5"]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/flxk1/loomground-escalation"
Repository = "https://github.com/flxk1/loomground-escalation"
Issues = "https://github.com/flxk1/loomground-escalation/issues"

[tool.setuptools.dynamic]
version = { attr = "loomground_escalation._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["loomground_escalation*"]

[tool.setuptools.package-data]
loomground_escalation = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
