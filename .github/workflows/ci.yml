name: ci
on:
  push:
  pull_request:

jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: REUSE / SPDX licensing compliance
        uses: fsfe/reuse-action@ef1dfe28dda4d13f5d580f0444eb27dda9746e9b  # v5

  verify:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt && python -m pip install ".[dev]" build
      - run: python -m pytest -q
      - run: python -m build

  # Added by repo-standards. The four family checks, run from a pinned clone of
  # github.com/flxk1/repo-standards — consumed, never vendored (STANDARDS.md, Layer 1 item 6).
  # Bump STANDARDS_REF to adopt a newer rule set; the pin is what makes a red job a real signal.
  standards:
    runs-on: ubuntu-latest
    env:
      STANDARDS_REPO: https://github.com/flxk1/repo-standards
      STANDARDS_REF: c262400f556bd957b08cf22341279db358ff1ab1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Clone repo-standards at the pin
        run: |
          git clone --filter=blob:none --no-checkout "$STANDARDS_REPO" ../repo-standards
          git -C ../repo-standards checkout --detach "$STANDARDS_REF"
      - name: README canon
        run: python3 ../repo-standards/tools/verify_text.py .
      - name: Agent Skills conformance
        # exit 2 is "this repo ships no skills", which is not a finding
        run: python3 ../repo-standards/tools/skills_lint.py . || [ $? = 2 ]
      - name: llms.txt drift
        run: python3 ../repo-standards/tools/llms_txt.py . --check
      - name: Skeleton root set
        run: python3 ../repo-standards/tools/verify_layout.py .
